<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Scrapbook of Memories</title>
    <style>
        body {
            background: #E9F5DB;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-family: 'Impact', sans-serif;
            color: #718355;
            font-size: 100px;
            margin: 20px 0;
            text-align: center;
            position: static; 
            margin-top: 70px; 
        }

        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            margin-top: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 10px;
            justify-items: center;
        }

        .photo {
            background-color: #FCE4D8;
            border: 4px dashed #97A97C;
            padding: 10px;
            border-radius: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            max-width: 250px;
            overflow: hidden;
        }

        .photo:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .photo img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            display: block;
        }

        .note {
            margin-top: 30px;
            background-color: #E1EEC3;
            color: #14281D;
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            font-size: 20px;
            text-align: center;
        }

        .final-message {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #14281D;
        }

        .music-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: center;
        }

        #playPauseBtn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #718355;
            color: #FFF;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        #playPauseBtn:hover {
            background-color: #5A6B45;
            transform: scale(1.1);
        }

        audio {
            display: none;
        }

        .navbar {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 15px;
      font-family: Arial, sans-serif;
    }
    .navbar a {
      text-decoration: none;
      font-size: 16px;
      color: #333;
      padding: 5px 10px;
      border: 1px solid #333;
      border-radius: 20px; /* Rounded buttons */
      background-color: #FFFCDC;
      box-shadow: 0 0 10px rgba(113, 131, 85, 0.3);
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .navbar a:hover {
      transform: scale(1.1);
      background-color: #E9F5DB;
      box-shadow: 0 0 20px rgba(113, 131, 85, 0.5);
    }
    /* Highlight the active page */
    .navbar a.active {
      background-color: #718355;
      color: #FFF;
      border-color: #718355;
    }

    <script>
        // Music control functionality
        const playPauseBtn = document.getElementById('playPauseBtn');
        const bgMusic = document.getElementById('bgMusic');

        playPauseBtn.addEventListener('click', function() {
            if (bgMusic.paused) {
                bgMusic.play();
                playPauseBtn.textContent = 'Pause Music';
            } else {
                bgMusic.pause();
                playPauseBtn.textContent = 'Play Music';
            }
        });
