<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #E9F5DB;
      font-family: 'Impact', sans-serif;
      margin: 0;
      padding: 40px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: left;
      justify-content: flex-start;
      margin-top: -100px; 
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
    }
    h1 {
      font-family: Impact, sans-serif;
      font-size: 150px;
      color: #718355;
      line-height: 0.9;
      text-align: left;
      flex: 1;
    }
    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1500px;
      flex-grow: 1;
    }
    .left {
      flex: 1;
      display: flex;
      justify-content: center;
    }
    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: right; /* Align text to the left */
      font-size: 200px;
      color: #718355;
      text-align: right; /* Ensure text alignment is left */
      animation: fadeRotate 2s ease-in-out, blurIn 2s ease-in-out;
    }
    @keyframes blurIn {
        0% {
            opacity: 0;
            filter: blur(10px);
        }
        100% {
            opacity: 1;
            filter: blur(0);
        }
    }
    canvas {
      background: #FFFCDC;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      max-width: 100%;
    }

    .navbar {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 15px;
      font-family: Arial, sans-serif;
    }
    .navbar a {
      text-decoration: none;
      font-size: 16px;
      color: #333;
      padding: 5px 10px;
      border: 1px solid #333;
      border-radius: 20px; /* Rounded buttons */
      background-color: #FFFCDC;
      box-shadow: 0 0 10px rgba(113, 131, 85, 0.3);
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .navbar a:hover {
      transform: scale(1.1);
      background-color: #E9F5DB;
      box-shadow: 0 0 20px rgba(113, 131, 85, 0.5);
    }
    /* Highlight the active page */
    .navbar a.active {
      background-color: #718355;
      color: #FFF;
      border-color: #718355;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="abt.html">About Me</a>
    <a href="Education.html">Education</a>
    <a href="skills.html" class="active">Skills</a>
    <a href="experience.html">Experience</a>
    <a href="achievement.html">Achievements</a>
    <a href="scrapbook.html">Scrapbook</a>

  </div>

  <div class="content">
    <div class="left">
      <canvas id="skillsChart" width="500" height="400"></canvas>
    </div>
    <div class="right">
      <p>SKILLS<br>MERITS</p>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('skillsChart').getContext('2d');
    const skillsChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Communication', 'Interpersonal', 'Practical Skills', 'Leadership'],
        datasets: [{
          label: 'Skill Level (%)',
          data: [98, 85, 93, 80],
          backgroundColor: 'rgba(135, 152, 106, 0.2)',
          borderColor: '#87986A',
          borderWidth: 3,
          pointBackgroundColor: '#718355',
          pointBorderColor: '#718355',
          pointRadius: 6,
          tension: 0.4 // smooth curve
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            max: 100
          }
        }
      }
    });
  </script>

</body>
</html>
